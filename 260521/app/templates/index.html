<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식인종 선교사 챗봇</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; background: #f4f7f6; margin: 0; padding: 20px; height: 100vh; box-sizing: border-box; }
        #chat-container { width: 100%; max-width: 600px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2em; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; }
        .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 15px; max-width: 75%; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 2px; }
        .bot-msg { background: #e9ecef; color: #333; align-self: flex-start; margin-right: auto; border-bottom-left-radius: 2px; }
        .system-msg { text-align: center; color: #888; font-size: 0.85em; margin-bottom: 15px; max-width: 100%; }
        #input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        #input-area input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 1em; transition: border-color 0.2s; }
        #input-area input:focus { border-color: #007bff; }
        #input-area button { padding: 10px 20px; margin-left: 10px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        #input-area button:hover { background: #0056b3; }
        #input-area button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* 스크롤바 커스텀 */
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">식인종 선교사 문제 해결 챗봇</div>
        <div id="chat-box"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="질문을 입력하세요..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}-msg`;
            
            // 줄바꿈 처리
            if (role === 'bot') {
                div.innerHTML = text.replace(/\n/g, '<br>');
            } else {
                div.innerText = text;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function initChat() {
            appendMessage('system', '챗봇 초기화 중...');
            try {
                const res = await fetch('/chatbot/init');
                if (res.ok) {
                    chatBox.innerHTML = '';
                    appendMessage('system', '식인종 선교사 문제 전문 챗봇이 준비되었습니다. 무엇이든 물어보세요!');
                } else {
                    throw new Error('Init failed');
                }
            } catch (e) {
                appendMessage('system', '초기화에 실패했습니다. 서버를 확인해주세요.');
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const res = await fetch('/chatbot/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                if (!res.ok) throw new Error('Network response was not ok');
                
                const data = await res.json();
                if (data && data.message) {
                    appendMessage('bot', data.message.content);
                } else {
                    appendMessage('system', '오류 발생: 알 수 없는 응답 형식입니다.');
                }
            } catch (e) {
                appendMessage('system', `서버 통신 에러: ${e.message}`);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        window.onload = initChat;
    </script>
</body>
</html>
